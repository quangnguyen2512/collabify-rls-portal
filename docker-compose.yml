services:
  postgres:
    image: postgres:16-alpine
    container_name: collabify_postgres
    environment:
      POSTGRES_DB: collabify
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-local_dev_superuser_only}
    ports:
      - "5432:5432"
    volumes:
      - ./db/migrations/001_multi_tenant_rls.sql:/docker-entrypoint-initdb.d/01_rls.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d collabify"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p1
    container_name: collabify_pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: collabify
      DB_USER: collabify_app
      DB_PASSWORD: ${COLLABIFY_APP_DB_PASSWORD:-local_dev_app_only}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:5432"
